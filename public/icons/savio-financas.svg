<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-label="Sávio Finanças" role="img">
  <defs>
    <linearGradient id="sf-pwa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#082B5C" />
      <stop offset="100%" stop-color="#061B3B" />
    </linearGradient>
    <linearGradient id="sf-pwa-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD85A" />
      <stop offset="100%" stop-color="#F5B719" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sf-pwa-bg)" />

  <!-- Financial Chart Bars (#FFFFFF) -->
  <rect x="96" y="268" width="56" height="108" rx="14" fill="#FFFFFF" opacity="0.96" />
  <rect x="176" y="210" width="56" height="166" rx="14" fill="#FFFFFF" opacity="0.96" />
  <rect x="256" y="150" width="56" height="226" rx="14" fill="#FFFFFF" opacity="0.96" />

  <!-- Upward Dynamic Growth Curve (#F5B719) -->
  <path
    d="M78 366 C164 304 238 296 316 230 C356 196 388 164 434 114"
    fill="none"
    stroke="url(#sf-pwa-gold)"
    stroke-width="32"
    stroke-linecap="round"
  />

  <!-- Arrow Head (#F5B719) -->
  <path
    d="M366 110 L444 100 L432 178"
    fill="none"
    stroke="#F5B719"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Financial Stability Underline (#00A65A) -->
  <path
    d="M78 404 C170 358 250 358 338 392"
    fill="none"
    stroke="#00A65A"
    stroke-width="26"
    stroke-linecap="round"
  />

  <!-- Gold Emblem Coin with Dollar Symbol -->
  <circle cx="370" cy="366" r="66" fill="url(#sf-pwa-gold)" stroke="#FFFFFF" stroke-width="6" />
  <text
    x="370"
    y="398"
    text-anchor="middle"
    font-size="94"
    font-weight="bold"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    fill="#082B5C"
  >$</text>
</svg>
